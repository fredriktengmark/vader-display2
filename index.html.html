<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väder Dashboard - Värnamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      background: rgba(30, 41, 59, 0.7);
      padding: 3rem 4rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .location { font-size: 1.5rem; font-weight: 600; color: #38bdf8; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 0.5rem; }
    .time { font-size: 4.5rem; font-weight: 700; letter-spacing: 2px; }
    .date { font-size: 1.4rem; color: #94a3b8; margin-bottom: 2rem; }
    .temp { font-size: 6rem; font-weight: 800; }
    .condition { font-size: 1.75rem; color: #cbd5e1; margin-top: 0.5rem; }
    .meta { margin-top: 2.5rem; display: flex; gap: 2.5rem; justify-content: center; font-size: 1.25rem; color: #94a3b8; }
    .meta span { font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <div class="location">Värnamo</div>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">Laddar datum...</div>
    <div class="temp" id="temp">--°C</div>
    <div class="condition" id="condition">Hämtar prognos...</div>
    <div class="meta">
      <span id="wind">Vind: -- m/s</span>
      <span id="humidity">Fuktighet: --%</span>
    </div>
  </div>

  <script>
    // Koordinater för Värnamo
    const LAT = 57.1864;
    const LON = 14.0403;

    const weatherCodes = {
      0: "Klart",
      1: "Mestadels klart", 2: "Halvklart", 3: "Molnigt",
      45: "Dimma", 48: "Rimfrostdimma",
      51: "Lätt duggregn", 53: "Duggregn", 55: "Tätt duggregn",
      61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snöfall", 73: "Snöfall", 75: "Kraftigt snöfall",
      80: "Lätta regnskurar", 81: "Regnskurar", 82: "Kraftiga skurar",
      95: "Åskväder"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    async function fetchWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('condition').textContent = weatherCodes[cur.weather_code] || "Okänt läge";
        document.getElementById('wind').textContent = `Vind: ${Math.round(cur.wind_speed_10m)} m/s`;
        document.getElementById('humidity').textContent = `Fuktighet: ${cur.relative_humidity_2m}%`;
      } catch (err) {
        document.getElementById('condition').textContent = "Kunde inte hämta data";
      }
    }

    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 15 * 60 * 1000); // Uppdateras automatiskt var 15:e minut

    updateClock();
    fetchWeather();
  </script>
</body>
</html>
