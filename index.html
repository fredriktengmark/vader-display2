<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD FTE VÄRNAMO REGIONFASTIGHETER</title>
  <style>
    :root {
      --bg-dark: #05070c;
      --panel-bg: #0d131f;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --police-blue: #3b82f6;
      --region-teal: #14b8a6;
      --news-purple: #a855f7;
      --alert-red: #ef4444;
      --alert-yellow: #f59e0b;
      --status-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.75rem;
    }

    /* Toppbanner */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--alert-red);
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
    }
    .top-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--alert-red);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
    }
    .top-clock {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
    }
    .top-date {
      color: #94a3b8;
      font-size: 1.15rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    /* Huvudgrid */
    .main-grid {
      display: grid;
      grid-template-columns: 440px 1fr 1fr;
      gap: 0.75rem;
      flex: 1;
      min-height: 0;
    }

    /* Paneler */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .panel-header {
      padding: 0.5rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    /* VÄNSTER KOLUMN */
    .telemetry-column {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      height: 100%;
      min-height: 0;
    }

    /* Väder */
    .weather-card {
      padding: 0.6rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .weather-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .temp-val {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
    }
    .condition-val {
      font-size: 0.95rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
    }
    .meta-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .metric-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
    }
    .metric-box label {
      display: block;
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .metric-box span {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    /* VMA */
    .vma-panel {
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--status-green);
      transition: all 0.3s ease;
    }
    .vma-panel.active {
      border: 1px solid var(--alert-red);
      border-left: 6px solid var(--alert-red);
      background: rgba(239, 68, 68, 0.08);
      animation: alertBlink 2s infinite;
    }
    @keyframes alertBlink {
      0%, 100% { box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.2); }
      50% { box-shadow: inset 0 0 25px rgba(239, 68, 68, 0.4); }
    }
    .vma-content {
      padding: 0.5rem 0.85rem;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.25;
    }
    .vma-status-tag {
      font-family: ui-monospace, monospace;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--status-green);
    }
    .vma-panel.active .vma-status-tag { background: var(--alert-red); color: #fff; }

    /* MULTI-FEED SEKTION MED FLIKAR */
    .multi-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .feed-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      flex: 1;
      padding: 0.5rem 0.25rem;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active.police { color: #60a5fa; border-color: var(--police-blue); background: rgba(59, 130, 246, 0.05); }
    .tab-btn.active.region { color: #5eead4; border-color: var(--region-teal); background: rgba(20, 184, 166, 0.05); }
    .tab-btn.active.news { color: #d8b4fe; border-color: var(--news-purple); background: rgba(168, 85, 247, 0.05); }
    .tab-btn.active.traffic { color: var(--alert-yellow); border-color: var(--alert-yellow); background: rgba(245, 158, 11, 0.05); }

    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .feed-node {
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      font-size: 0.78rem;
      text-decoration: none;
      display: block;
      color: inherit;
      transition: all 0.2s ease;
    }
    .feed-node.police { background: rgba(37, 99, 235, 0.04); border: 1px solid rgba(59, 130, 246, 0.2); border-left: 3px solid var(--police-blue); }
    .feed-node.region { background: rgba(20, 184, 166, 0.04); border: 1px solid rgba(20, 184, 166, 0.2); border-left: 3px solid var(--region-teal); }
    .feed-node.news { background: rgba(168, 85, 247, 0.04); border: 1px solid rgba(168, 85, 247, 0.2); border-left: 3px solid var(--news-purple); }
    .feed-node.traffic { background: rgba(245, 158, 11, 0.04); border: 1px solid rgba(245, 158, 11, 0.2); border-left: 3px solid var(--alert-yellow); }

    .feed-node:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(2px);
    }
    .feed-title {
      font-weight: 700;
      margin-bottom: 0.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-node.police .feed-title { color: #93c5fd; }
    .feed-node.region .feed-title { color: #5eead4; }
    .feed-node.news .feed-title { color: #d8b4fe; }
    .feed-node.traffic .feed-title { color: var(--alert-yellow); }
    .feed-msg { color: #cbd5e1; font-size: 0.73rem; line-height: 1.25; }

    .push-btn {
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
    }
    .push-btn.enabled {
      background: rgba(37, 99, 235, 0.25);
      color: #60a5fa;
      border-color: #2563eb;
    }

    /* KARTOR */
    .map-frame-wrapper { position: relative; height: 100%; width: 100%; }
    .map-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(5, 7, 12, 0.9);
      border: 1px solid var(--border-color);
      color: #94a3b8;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-title">
      <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--alert-red); box-shadow:0 0 8px var(--alert-red);"></span>
      DASHBOARD FTE VÄRNAMO REGIONFASTIGHETER
    </div>
    <div class="top-clock">
      <span class="top-date" id="date">--</span>
      <span id="time">--:--:--</span>
    </div>
  </header>

  <main class="main-grid">

    <!-- Kolumn 1 -->
    <div class="telemetry-column">

      <!-- Väder -->
      <div class="panel">
        <div class="panel-header">
          <span>Lokal Telemetri</span>
          <span style="color:var(--text-muted);">VÄRNAMO</span>
        </div>
        <div class="weather-card">
          <div class="weather-main">
            <div class="temp-val" id="temp">--°</div>
            <div class="condition-val" id="condition">Hämtar...</div>
          </div>
          <div class="meta-metrics">
            <div class="metric-box">
              <label>Vind</label>
              <span id="wind">-- m/s</span>
            </div>
            <div class="metric-box">
              <label>Fuktighet</label>
              <span id="humidity">-- %</span>
            </div>
          </div>
        </div>
      </div>

      <!-- VMA -->
      <div class="panel vma-panel" id="vma-panel">
        <div class="panel-header">
          <span>VMA / Krisläge</span>
          <span class="vma-status-tag" id="vma-tag">NORMAL</span>
        </div>
        <div class="vma-content" id="vma-content">
          Kontrollerar regionala larm...
        </div>
      </div>

      <!-- Operativt flöde med flikar -->
      <div class="panel multi-panel">
        <div class="panel-header">
          <span>Operativt Larmflöde</span>
          <button id="btn-push" class="push-btn" onclick="requestNotificationAccess()">Aktivera Push</button>
        </div>

        <div class="feed-tabs">
          <button class="tab-btn active police" onclick="switchTab('police')">Polis</button>
          <button class="tab-btn region" onclick="switchTab('region')">Region JL</button>
          <button class="tab-btn news" onclick="switchTab('news')">Lokalnyheter</button>
          <button class="tab-btn traffic" onclick="switchTab('traffic')">Trafik</button>
        </div>

        <div class="feed-container" id="active-feed">
          <div style="font-size:0.75rem; color:var(--text-muted);">Initierar feed...</div>
        </div>
      </div>

    </div>

    <!-- Kolumn 2: Satellit Regn -->
    <div class="panel">
      <div class="map-frame-wrapper">
        <div class="map-tag">SATELLIT // REGNRADAR</div>
        <iframe 
          id="radar-frame"
          src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=m%2Fs&zoom=5&overlay=radar&product=radar&level=surface&lat=57.186&lon=14.040" 
          loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- Kolumn 3: Satellit Åska -->
    <div class="panel">
      <div class="map-frame-wrapper">
        <div class="map-tag">SATELLIT // BLIXTAR & ÅSKA</div>
        <iframe 
          id="lightning-frame"
          src="https://map.blitzortung.org/index.php?interactive=1&MapStyle=2#5/57.186/14.040" 
          loading="lazy">
        </iframe>
      </div>
    </div>

  </main>

  <script>
    const LAT = 57.1864;
    const LON = 14.0403;

    let currentTab = 'police';
    let knownIds = new Set();
    let pushEnabled = false;

    // Cache för data från flödena
    const feedStore = {
      police: [],
      region: [],
      news: [],
      traffic: []
    };

    const weatherCodes = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Mulet",
      45: "Dimma", 48: "Rimfrostdimma", 51: "Duggregn", 53: "Duggregn",
      55: "Tätt duggregn", 61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snö", 73: "Snöfall", 75: "Ymnigt snöfall",
      80: "Skurar", 81: "Regnskurar", 82: "Kraftiga skurar", 95: "Åska"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('sv-SE', { hour12: false });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    async function fetchWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById('condition').textContent = weatherCodes[cur.weather_code] || "Okänt";
        document.getElementById('wind').textContent = `${Math.round(cur.wind_speed_10m)} m/s`;
        document.getElementById('humidity').textContent = `${cur.relative_humidity_2m} %`;
      } catch (err) {
        document.getElementById('condition').textContent = "OFFLINE";
      }
    }

    function requestNotificationAccess() {
      if (!("Notification" in window)) {
        alert("Webbläsaren saknar stöd för pushnotiser.");
        return;
      }
      Notification.requestPermission().then(perm => {
        if (perm === "granted") {
          pushEnabled = true;
          const btn = document.getElementById('btn-push');
          btn.textContent = "Push På";
          btn.classList.add('enabled');
          new Notification("FTE Kontrollrum", { 
            body: "Pushnotiser aktiverade för Polis, Region och Nyheter i Jönköpings län."
          });
        }
      });
    }

    function triggerPush(title, body, url) {
      if (pushEnabled && Notification.permission === "granted") {
        const notif = new Notification(title, {
          body: body,
          icon: "https://polisen.se/Static/images/police-badge.svg"
        });
        if (url) {
          notif.onclick = () => { window.open(url, '_blank'); };
        }
      }
    }

    /* 1. POLISEN API */
    async function fetchPolice() {
      try {
        const res = await fetch('https://polisen.se/api/events?locationname=J%C3%B6nk%C3%B6pings%20l%C3%A4n');
        const events = await res.json();
        
        feedStore.police = events.slice(0, 8).map(ev => {
          const id = 'pol_' + ev.id;
          const url = `https://polisen.se${ev.url}`;
          if (knownIds.size > 0 && !knownIds.has(id)) {
            triggerPush(`POLIS // ${ev.type} (${ev.location.name})`, ev.summary, url);
          }
          knownIds.add(id);
          return {
            title: `${ev.datetime.split(" ")[1]} // ${ev.type} (${ev.location.name})`,
            msg: ev.summary,
            url: url,
            type: 'police'
          };
        });
        if (currentTab === 'police') renderCurrentTab();
      } catch (e) {
        console.warn('Polis-fetch misslyckades');
      }
    }

    /* 2. REGION JÖNKÖPINGS LÄN (Via TT Pressflöde) */
    async function fetchRegion() {
      try {
        const feedUrl = encodeURIComponent('https://via.tt.se/rss/pressmeddelanden/3236484/region-jonkopings-lan');
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`);
        const data = await res.json();
        
        if (data.items) {
          feedStore.region = data.items.slice(0, 8).map(item => {
            const id = 'reg_' + item.guid;
            if (knownIds.size > 0 && !knownIds.has(id)) {
              triggerPush(`REGION JÖNKÖPINGS LÄN`, item.title, item.link);
            }
            knownIds.add(id);
            return {
              title: item.title,
              msg: item.description.replace(/<[^>]*>?/gm, '').slice(0, 140) + '...',
              url: item.link,
              type: 'region'
            };
          });
          if (currentTab === 'region') renderCurrentTab();
        }
      } catch (e) {
        console.warn('Region-fetch misslyckades');
      }
    }

    /* 3. LOKALNYHETER (SVT Jönköping / Värnamo) */
    async function fetchNews() {
      try {
        const feedUrl = encodeURIComponent('https://www.svt.se/nyheter/lokalt/jonkoping/rss.xml');
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${feedUrl}`);
        const data = await res.json();

        if (data.items) {
          feedStore.news = data.items.slice(0, 8).map(item => {
            const id = 'news_' + item.guid;
            if (knownIds.size > 0 && !knownIds.has(id)) {
              triggerPush(`NYHET // JÖNKÖPINGS LÄN`, item.title, item.link);
            }
            knownIds.add(id);
            return {
              title: item.title,
              msg: item.description.replace(/<[^>]*>?/gm, '').slice(0, 140) + '...',
              url: item.link,
              type: 'news'
            };
          });
          if (currentTab === 'news') renderCurrentTab();
        }
      } catch (e) {
        console.warn('News-fetch misslyckades');
      }
    }

    /* 4. TRAFIKVERKET API (Län 06) */
    async function fetchTraffic() {
      const xmlPayload = `
        <REQUEST>
          <LOGIN authenticationkey="5d4f134267254589a1fbbd09793108c9" />
          <QUERY objecttype="Situation" schemaversion="1.5" limit="8">
            <FILTER><EQ name="Deviation.CountyNo" value="6" /></FILTER>
            <INCLUDE>Deviation.Header</INCLUDE>
            <INCLUDE>Deviation.Message</INCLUDE>
            <INCLUDE>Deviation.RoadNumber</INCLUDE>
          </QUERY>
        </REQUEST>`;

      try {
        const res = await fetch('https://api.trafikinfo.trafikverket.se/v2/data.json', {
          method: 'POST',
          headers: { 'Content-Type': 'text/xml' },
          body: xmlPayload
        });
        const json = await res.json();
        const situations = json.RESPONSE?.RESULT?.[0]?.Situation || [];

        const deviations = [];
        situations.forEach(s => {
          if (Array.isArray(s.Deviation)) deviations.push(...s.Deviation);
          else if (s.Deviation) deviations.push(s.Deviation);
        });

        feedStore.traffic = deviations.slice(0, 8).map(d => ({
          title: (d.RoadNumber ? 'VÄG ' + d.RoadNumber + ' // ' : '') + (d.Header || 'Avvikelse'),
          msg: d.Message || 'Ingen ytterligare rapport.',
          url: 'https://trafiken.nu',
          type: 'traffic'
        }));
        if (currentTab === 'traffic') renderCurrentTab();
      } catch (e) {
        console.warn('Trafik-fetch misslyckades');
      }
    }

    /* VMA */
    async function fetchVMA() {
      const panel = document.getElementById('vma-panel');
      const tag = document.getElementById('vma-tag');
      const content = document.getElementById('vma-content');

      try {
        const res = await fetch('https://api.krisinformation.se/v3/vmas');
        const list = await res.json();

        const vmaMatch = list.find(item => {
          const raw = ((item.PushMessage || "") + " " + (item.BodyText || "") + " " + (item.Headline || "")).toLowerCase();
          return raw.includes('jönköping') || raw.includes('värnamo');
        });

        if (vmaMatch) {
          panel.classList.add('active');
          tag.textContent = 'LARM AKTIVT';
          content.innerHTML = `
            <strong style="color:var(--alert-red); display:block; margin-bottom:4px;">${vmaMatch.Headline || 'VIKTIGT MEDDELANDE'}</strong>
            <span>${vmaMatch.PushMessage || vmaMatch.BodyText}</span>
          `;
          triggerPush(`🚨 VMA UTFÄRDAT`, vmaMatch.Headline || vmaMatch.PushMessage, 'https://krisinformation.se');
        } else {
          panel.classList.remove('active');
          tag.textContent = 'NORMAL';
          content.innerHTML = 'Inga aktiva VMA i Jönköpings län.';
        }
      } catch (err) {
        panel.classList.remove('active');
        tag.textContent = 'STANDBY';
        content.innerHTML = 'Inga aktiva larm.';
      }
    }

    /* Flikbyte & Rendrering */
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.tab-btn.${tab}`).classList.add('active');
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('active-feed');
      const list = feedStore[currentTab] || [];

      if (list.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); padding:0.5rem 0;">Hämtar data / Inga aktiva händelser...</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="feed-node ${item.type}">
          <div class="feed-title">
            <span>${item.title}</span>
            <span style="font-size:0.65rem; opacity:0.6;">↗</span>
          </div>
          <div class="feed-msg">${item.msg}</div>
        </a>
      `).join('');
    }

    function refreshMaps() {
      const radar = document.getElementById('radar-frame');
      const lightning = document.getElementById('lightning-frame');
      if (radar) radar.src = radar.src;
      if (lightning) lightning.src = lightning.src;
    }

    // Intervaller
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 10 * 60 * 1000);
    setInterval(fetchPolice, 2 * 60 * 1000);
    setInterval(fetchRegion, 4 * 60 * 1000);
    setInterval(fetchNews, 5 * 60 * 1000);
    setInterval(fetchTraffic, 2 * 60 * 1000);
    setInterval(fetchVMA, 1 * 60 * 1000);
    setInterval(refreshMaps, 10 * 60 * 1000);

    // Uppstart
    updateClock();
    fetchWeather();
    fetchPolice();
    fetchRegion();
    fetchNews();
