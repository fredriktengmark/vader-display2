<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD FTE VÄRNAMO REGIONFASTIGHETER</title>
  <style>
    :root {
      --bg-dark: #05070c;
      --panel-bg: #0d131f;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --alert-red: #ef4444;
      --alert-yellow: #f59e0b;
      --status-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.75rem;
    }

    /* Toppbanner: Status & Extra stor Klocka */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--alert-red);
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
    }
    .top-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--alert-red);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.35);
    }
    .top-clock {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
    }
    .top-date {
      color: #94a3b8;
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    /* Huvudcontainer */
    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr 1fr;
      gap: 0.75rem;
      flex: 1;
      min-height: 0;
    }

    /* Paneler */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .panel-header {
      padding: 0.6rem 0.85rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
    }

    /* VÄNSTER KOLUMN: Status & Varningar */
    .telemetry-column {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      height: 100%;
    }

    /* Väderkort */
    .weather-card {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .weather-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .temp-val {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 3.6rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
    }
    .condition-val {
      font-size: 1.1rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 600;
    }
    .meta-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .metric-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 0.5rem;
      border-radius: 4px;
    }
    .metric-box label {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .metric-box span {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-blue);
    }

    /* VMA: RÖD STATUS */
    .vma-panel {
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--status-green);
      transition: all 0.3s ease;
    }
    .vma-panel.active {
      border: 1px solid var(--alert-red);
      border-left: 6px solid var(--alert-red);
      background: rgba(239, 68, 68, 0.08);
      animation: alertBlink 2s infinite;
    }
    @keyframes alertBlink {
      0%, 100% { box-shadow: inset 0 0 15px rgba(239, 68, 68, 0.2); }
      50% { box-shadow: inset 0 0 25px rgba(239, 68, 68, 0.4); }
    }
    .vma-content {
      padding: 0.75rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.35;
    }
    .vma-status-tag {
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--status-green);
    }
    .vma-panel.active .vma-status-tag {
      background: var(--alert-red);
      color: #fff;
    }

    /* TRAFIK: GUL / AMBER */
    .traffic-panel {
      flex: 1;
      border-top: 2px solid var(--alert-yellow);
      min-height: 0;
    }
    .traffic-header-text {
      color: var(--alert-yellow);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .traffic-feed {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .traffic-node {
      background: rgba(245, 158, 11, 0.03);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-left: 3px solid var(--alert-yellow);
      padding: 0.6rem;
      border-radius: 4px;
    }
    .traffic-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--alert-yellow);
      margin-bottom: 0.2rem;
    }
    .traffic-msg {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    /* KARTOR */
    .map-frame-wrapper {
      position: relative;
      height: 100%;
      width: 100%;
    }
    .map-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(5, 7, 12, 0.9);
      border: 1px solid var(--border-color);
      color: #94a3b8;
      font-family: ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      z-index: 5;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Topprad med systemstatus och förstorad klocka -->
  <header class="top-bar">
    <div class="top-title">
      <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--alert-red); box-shadow:0 0 8px var(--alert-red);"></span>
      DASHBOARD FTE VÄRNAMO REGIONFASTIGHETER
    </div>
    <div class="top-clock">
      <span class="top-date" id="date">--</span>
      <span id="time">--:--:--</span>
    </div>
  </header>

  <!-- Huvudvy -->
  <main class="main-grid">

    <!-- Kolumn 1: Telemetri, VMA och Trafik -->
    <div class="telemetry-column">

      <!-- Väder -->
      <div class="panel">
        <div class="panel-header">
          <span>Lokal Vädertelemetri</span>
          <span style="color:var(--text-muted);">VÄRNAMO</span>
        </div>
        <div class="weather-card">
          <div class="weather-main">
            <div class="temp-val" id="temp">--°</div>
            <div class="condition-val" id="condition">Hämtar...</div>
          </div>
          <div class="meta-metrics">
            <div class="metric-box">
              <label>Vindhastighet</label>
              <span id="wind">-- m/s</span>
            </div>
            <div class="metric-box">
              <label>Luftfuktighet</label>
              <span id="humidity">-- %</span>
            </div>
          </div>
        </div>
      </div>

      <!-- VMA (Röd sektion) -->
      <div class="panel vma-panel" id="vma-panel">
        <div class="panel-header">
          <span style="color: var(--text-main);">VMA / Krisinformation</span>
          <span class="vma-status-tag" id="vma-tag">NORMAL</span>
        </div>
        <div class="vma-content" id="vma-content">
          Kontrollerar nationella och regionala larm...
        </div>
      </div>

      <!-- Trafik (Gul sektion) -->
      <div class="panel traffic-panel">
        <div class="panel-header">
          <div class="traffic-header-text">
            <span>⚠</span>
            <span>Trafikavvikelser (Län 06)</span>
          </div>
          <span style="font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--text-muted);" id="traffic-counter">0 STÖRNINGAR</span>
        </div>
        <div class="traffic-feed" id="traffic-feed">
          <div style="font-size:0.8rem; color:var(--text-muted);">Söker trafikläget...</div>
        </div>
      </div>

    </div>

    <!-- Kolumn 2: Nederbördskarta -->
    <div class="panel">
      <div class="map-frame-wrapper">
        <div class="map-tag">RADAR // REGN & SNÖ</div>
        <iframe 
          id="radar-frame"
          src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=m%2Fs&zoom=7&overlay=radar&product=radar&level=surface&lat=57.186&lon=14.040" 
          loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- Kolumn 3: Åskradar -->
    <div class="panel">
      <div class="map-frame-wrapper">
        <div class="map-tag">SENSORER // BLIXTAR REALTID</div>
        <iframe 
          id="lightning-frame"
          src="https://map.blitzortung.org/index.php?interactive=1#6.5/57.186/14.040" 
          loading="lazy">
        </iframe>
      </div>
    </div>

  </main>

  <script>
    const LAT = 57.1864;
    const LON = 14.0403;

    const weatherCodes = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Mulet",
      45: "Dimma", 48: "Rimfrostdimma", 51: "Duggregn", 53: "Duggregn",
      55: "Tätt duggregn", 61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snö", 73: "Snöfall", 75: "Ymnigt snöfall",
      80: "Skurar", 81: "Regnskurar", 82: "Kraftiga skurar", 95: "Åska"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('sv-SE', { hour12: false });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    async function fetchWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById('condition').textContent = weatherCodes[cur.weather_code] || "Okänt";
        document.getElementById('wind').textContent = `${Math.round(cur.wind_speed_10m)} m/s`;
        document.getElementById('humidity').textContent = `${cur.relative_humidity_2m} %`;
      } catch (err) {
        document.getElementById('condition').textContent = "OFFLINE";
      }
    }

    // Trafikverket API: Filtrerat strikt på länskod 6 (Jönköpings län)
    async function fetchTraffic() {
      const feed = document.getElementById('traffic-feed');
      const counter = document.getElementById('traffic-counter');
      const xmlPayload = `
        <REQUEST>
          <LOGIN authenticationkey="5d4f134267254589a1fbbd09793108c9" />
          <QUERY objecttype="Situation" schemaversion="1.5" limit="8">
            <FILTER>
              <EQ name="Deviation.CountyNo" value="6" />
            </FILTER>
            <INCLUDE>Deviation.Header</INCLUDE>
            <INCLUDE>Deviation.Message</INCLUDE>
            <INCLUDE>Deviation.RoadNumber</INCLUDE>
          </QUERY>
        </REQUEST>`;

      try {
        const res = await fetch('https://api.trafikinfo.trafikverket.se/v2/data.json', {
          method: 'POST',
          headers: { 'Content-Type': 'text/xml' },
          body: xmlPayload
        });
        const json = await res.json();
        const situations = json.RESPONSE?.RESULT?.[0]?.Situation || [];

        const deviations = [];
        situations.forEach(s => {
          if (Array.isArray(s.Deviation)) deviations.push(...s.Deviation);
          else if (s.Deviation) deviations.push(s.Deviation);
        });

        counter.textContent = `${deviations.length} HÄNDELSER`;

        if (deviations.length === 0) {
          feed.innerHTML = '<div style="font-size:0.8rem; color:var(--text-muted); padding:0.5rem 0;">Inga registrerade störningar i länet. Normal framkomlighet.</div>';
          return;
        }

        feed.innerHTML = deviations.map(d => `
          <div class="traffic-node">
            <div class="traffic-title">${d.RoadNumber ? 'VÄG ' + d.RoadNumber + ' // ' : ''}${d.Header || 'Avvikelse'}</div>
            <div class="traffic-msg">${d.Message || 'Ingen ytterligare rapport.'}</div>
          </div>
        `).join('');
      } catch (err) {
        feed.innerHTML = '<div style="color:var(--alert-red); font-size:0.8rem;">Fel vid kontakt med Trafikverkets API.</div>';
      }
    }

    // VMA / Krisinformation
    async function fetchVMA() {
      const panel = document.getElementById('vma-panel');
      const tag = document.getElementById('vma-tag');
      const content = document.getElementById('vma-content');

      try {
        const res = await fetch('https://api.krisinformation.se/v3/vmas');
        if (!res.ok) throw new Error('Status ' + res.status);
        const list = await res.json();

        const vmaMatch = list.find(item => {
          const raw = ((item.PushMessage || "") + " " + (item.BodyText || "") + " " + (item.Headline || "")).toLowerCase();
          return raw.includes('jönköping') || raw.includes('värnamo');
        });

        if (vmaMatch) {
          panel.classList.add('active');
          tag.textContent = 'LARM AKTIVT';
          content.innerHTML = `
            <strong style="color:var(--alert-red); display:block; margin-bottom:4px;">${vmaMatch.Headline || 'VIKTIGT MEDDELANDE'}</strong>
            <span>${vmaMatch.PushMessage || vmaMatch.BodyText}</span>
          `;
        } else {
          panel.classList.remove('active');
          tag.textContent = 'NORMAL';
          content.innerHTML = 'Inga aktiva VMA utfärdade för Jönköpings län.';
        }
      } catch (err) {
        panel.classList.remove('active');
        tag.textContent = 'STANDBY';
        content.innerHTML = 'Inga aktiva larm identifierade.';
      }
    }

    function refreshMaps() {
      const radar = document.getElementById('radar-frame');
      const lightning = document.getElementById('lightning-frame');
      if (radar) radar.src = radar.src;
      if (lightning) lightning.src = lightning.src;
    }

    // Intervaller
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 10 * 60 * 1000);
    setInterval(fetchTraffic, 2 * 60 * 1000);
    setInterval(fetchVMA, 1 * 60 * 1000);
    setInterval(refreshMaps, 10 * 60 * 1000);

    // Initial körning
    updateClock();
    fetchWeather();
    fetchTraffic();
    fetchVMA();
  </script>
</body>
</html>
