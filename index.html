<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väder & Lägesbild - Värnamo & Jönköpings Län</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1rem;
      gap: 1rem;
    }

    /* VMA Varningsbanner */
    #vma-banner {
      display: none;
      background: #dc2626;
      color: #ffffff;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
      animation: pulse-red 2s infinite;
      border: 2px solid #f87171;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.92; transform: scale(1.002); }
    }

    /* Huvudlayout: Vänster info / Höger kartor */
    .main-container {
      flex: 1;
      display: flex;
      gap: 1rem;
      height: calc(100% - 2rem);
      overflow: hidden;
    }

    /* Vänster spalt */
    .left-panel {
      flex: 0 0 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
      overflow: hidden;
    }

    /* Väderkort */
    .weather-box {
      background: rgba(23, 32, 51, 0.9);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    .location { font-size: 1.2rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
    .time { font-size: 3.5rem; font-weight: 700; line-height: 1.1; margin-top: 0.25rem; }
    .date { font-size: 1.1rem; color: #94a3b8; margin-bottom: 1rem; }
    .temp-row { display: flex; align-items: baseline; gap: 1rem; }
    .temp { font-size: 4.5rem; font-weight: 800; line-height: 1; }
    .condition { font-size: 1.25rem; color: #e2e8f0; margin-top: 0.25rem; }
    .meta { display: flex; justify-content: space-between; font-size: 1.05rem; color: #94a3b8; margin-top: 1rem; border-top: 1px solid #334155; padding-top: 0.75rem; }
    .meta strong { color: #f8fafc; }

    /* Trafikpanel */
    .traffic-box {
      flex: 1;
      background: rgba(23, 32, 51, 0.9);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    .panel-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    .traffic-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-right: 4px;
    }
    .traffic-list::-webkit-scrollbar { width: 4px; }
    .traffic-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .traffic-item {
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid #f59e0b;
      padding: 0.6rem 0.75rem;
      border-radius: 0.4rem;
      font-size: 0.9rem;
    }
    .traffic-item.urgent { border-left-color: #ef4444; }
    .traffic-title { font-weight: 700; color: #f8fafc; margin-bottom: 0.2rem; }
    .traffic-desc { color: #cbd5e1; font-size: 0.85rem; line-height: 1.3; }

    /* Höger panel: Kartor */
    .maps-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }
    .map-box {
      flex: 1;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #334155;
      background: #111827;
      position: relative;
    }
    .map-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      z-index: 10;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- VMA Banner (visas enbart vid aktiv varning) -->
  <div id="vma-banner">
    ⚠️ <span id="vma-title">VIKTIGT MEDDELANDE TILL ALLMÄNHETEN (VMA)</span>: 
    <span id="vma-desc" style="font-weight: normal; margin-left: 5px;"></span>
  </div>

  <div class="main-container">
    <!-- Vänster spalt -->
    <div class="left-panel">
      
      <!-- Väder -->
      <div class="weather-box">
        <div>
          <div class="location">Värnamo</div>
          <div class="time" id="time">--:--</div>
          <div class="date" id="date">Laddar...</div>
        </div>

        <div>
          <div class="temp-row">
            <div class="temp" id="temp">--°</div>
            <div class="condition" id="condition">Hämtar väder...</div>
          </div>
        </div>

        <div class="meta">
          <span>Vind: <strong id="wind">-- m/s</strong></span>
          <span>Fuktighet: <strong id="humidity">--%</strong></span>
        </div>
      </div>

      <!-- Trafikinformation SR -->
      <div class="traffic-box">
        <div class="panel-header">
          <span>Trafik Jönköpings Län</span>
          <span class="status-dot" id="vma-status" title="VMA Status: Normalt"></span>
        </div>
        <div class="traffic-list" id="traffic-list">
          <div style="color: #64748b; font-size: 0.9rem;">Hämtar trafikläget...</div>
        </div>
      </div>

    </div>

    <!-- Höger spalt: Kartor -->
    <div class="maps-panel">
      <!-- Nederbördsradar -->
      <div class="map-box">
        <div class="map-label">Nederbörd / Radar (Realtid)</div>
        <iframe 
          id="radar-frame"
          src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=m%2Fs&zoom=7&overlay=radar&product=radar&level=surface&lat=57.186&lon=14.040" 
          loading="lazy">
        </iframe>
      </div>

      <!-- Åskradar -->
      <div class="map-box">
        <div class="map-label">Åskradar (Realtid / Blixtar)</div>
        <iframe 
          id="lightning-frame"
          src="https://map.blitzortung.org/index.php?interactive=1#6.5/57.186/14.040" 
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    const LAT = 57.1864;
    const LON = 14.0403;

    const weatherCodes = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Molnigt",
      45: "Dimma", 48: "Rimfrostdimma", 51: "Lätt duggregn", 53: "Duggregn",
      55: "Tätt duggregn", 61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snöfall", 73: "Snöfall", 75: "Kraftigt snöfall",
      80: "Lätta skurar", 81: "Regnskurar", 82: "Kraftiga skurar", 95: "Åskväder"
    };

    // 1. Klocka
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    // 2. Väder (Open-Meteo)
    async function fetchWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°`;
        document.getElementById('condition').textContent = weatherCodes[cur.weather_code] || "Okänt läge";
        document.getElementById('wind').textContent = `${Math.round(cur.wind_speed_10m)} m/s`;
        document.getElementById('humidity').textContent = `${cur.relative_humidity_2m}%`;
      } catch (err) {
        document.getElementById('condition').textContent = "Fel vid väderdata";
      }
    }

    // 3. Trafikmeddelanden från Sveriges Radio (Jönköpings län)
    async function fetchTraffic() {
      const listEl = document.getElementById('traffic-list');
      try {
        // SR Trafikområde Jönköping (ID: 10)
        const res = await fetch('https://api.sr.se/api/v2/traffic/messages?trafficareaid=10&format=json&size=10');
        const data = await res.json();
        const messages = data.messages || [];

        if (messages.length === 0) {
          listEl.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem; padding-top: 0.5rem;">Inga rapporterade trafikhinder i Jönköpings län just nu.</div>';
          return;
        }

        listEl.innerHTML = messages.map(msg => {
          const isUrgent = msg.priority <= 2;
          return `
            <div class="traffic-item ${isUrgent ? 'urgent' : ''}">
              <div class="traffic-title">${msg.title}</div>
              <div class="traffic-desc">${msg.description}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<div style="color: #ef4444; font-size: 0.85rem;">Kunde inte hämta trafikinformation.</div>';
      }
    }

    // 4. VMA-kontroll (Krisinformation.se)
    async function checkVMA() {
      const banner = document.getElementById('vma-banner');
      const vmaStatusDot = document.getElementById('vma-status');
      try {
        const res = await fetch('https://api.krisinformation.se/v3/vmas?format=json');
        const vmas = await res.json();

        // Filtrera för Jönköpings län eller riksomfattande larm
        const activeForArea = (vmas || []).filter(v => {
          if (!v.Area) return true;
          return v.Area.some(a => a.Description.includes('Jönköping') || a.Description.includes('Hela Sverige'));
        });

        if (activeForArea.length > 0) {
          const alert = activeForArea[0];
          document.getElementById('vma-title').textContent = alert.Headline || "VIKTIGT MEDDELANDE TILL ALLMÄNHETEN";
          document.getElementById('vma-desc').textContent = alert.Preamble || alert.BodyText || "Följ Sveriges Radio P4 för instruktioner.";
          banner.style.display = 'block';
          vmaStatusDot.style.background = '#ef4444';
          vmaStatusDot.style.boxShadow = '0 0 10px #ef4444';
        } else {
          banner.style.display = 'none';
          vmaStatusDot.style.background = '#22c55e';
          vmaStatusDot.style.boxShadow = '0 0 8px #22c55e';
        }
      } catch (err) {
        // Tyst hantering vid eventuell timeout
      }
    }

    // Uppdatera kartor i bakgrunden
    function refreshMaps() {
      const radar = document.getElementById('radar-frame');
      const lightning = document.getElementById('lightning-frame');
      if (radar) radar.src = radar.src;
      if (lightning) lightning.src = lightning.src;
    }

    // Intervaller för realtid
    setInterval(updateClock, 1000);
    setInterval(fetchTraffic, 3 * 60 * 1000);  // Trafik var 3:e minut
    setInterval(checkVMA, 2 * 60 * 1000);      // VMA var 2:a minut
    setInterval(fetchWeather, 10 * 60 * 1000); // Väder var 10:e minut
    setInterval(refreshMaps, 10 * 60 * 1000);  // Kartor var 10:e minut

    // Initiera direkt vid start
    updateClock();
    fetchWeather();
    fetchTraffic();
    checkVMA();
  </script>
</body>
</html>
