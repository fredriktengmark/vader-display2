<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Väder & Trafik - Värnamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 1.25rem;
      gap: 1.25rem;
    }

    /* Vänster kolumn */
    .left-panel {
      flex: 0 0 380px;
      background: rgba(23, 32, 51, 0.85);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }
    .location { font-size: 1.3rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
    .time { font-size: 3.2rem; font-weight: 700; line-height: 1; margin-top: 0.25rem; }
    .date { font-size: 1rem; color: #94a3b8; }
    .temp-row { display: flex; justify-content: space-between; align-items: baseline; }
    .temp { font-size: 3.5rem; font-weight: 800; line-height: 1; }
    .condition { font-size: 1.2rem; color: #e2e8f0; }
    .meta { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.95rem; color: #94a3b8; }
    .meta span { display: flex; justify-content: space-between; }
    .meta strong { color: #f8fafc; }

    /* VMA & Krissektion */
    .vma-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .vma-card.active {
      background: rgba(185, 28, 28, 0.25);
      border-color: #ef4444;
      animation: alertPulse 1.8s infinite;
    }
    @keyframes alertPulse {
      0%, 100% { border-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { border-color: #f87171; box-shadow: 0 0 12px 2px rgba(239, 68, 68, 0.6); }
    }
    .vma-title {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
      color: #94a3b8;
    }
    .vma-card.active .vma-title { color: #f87171; }
    .vma-status { font-size: 0.85rem; color: #cbd5e1; line-height: 1.3; }

    /* Trafiksektion */
    .traffic-section {
      border-top: 1px solid #334155;
      padding-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
      min-height: 140px;
    }
    .traffic-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .traffic-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      font-size: 0.85rem;
      padding-right: 2px;
    }
    .traffic-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
    }
    .traffic-title { font-weight: 600; color: #f1f5f9; margin-bottom: 0.2rem; }
    .traffic-desc { color: #94a3b8; line-height: 1.25; }

    /* Höger kolumn: Kartor */
    .maps-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      height: 100%;
    }
    .map-box {
      flex: 1;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background: #111827;
      position: relative;
    }
    .map-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      z-index: 10;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Vänsterpanel -->
  <div class="left-panel">
    <div>
      <div class="location">Värnamo</div>
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">Laddar...</div>
    </div>

    <div>
      <div class="temp-row">
        <div class="temp" id="temp">--°C</div>
        <div class="condition" id="condition">Hämtar...</div>
      </div>
    </div>

    <div class="meta">
      <span>Vind: <strong id="wind">-- m/s</strong></span>
      <span>Luftfuktighet: <strong id="humidity">--%</strong></span>
    </div>

    <!-- Fast VMA-sektion -->
    <div id="vma-card" class="vma-card">
      <div class="vma-title">
        <span id="vma-icon">🟢</span>
        <span>VMA / Krisläge</span>
      </div>
      <div id="vma-body" class="vma-status">Kontrollerar VMA i Jönköpings län...</div>
    </div>

    <!-- Trafiksektion: Länskod 6 -->
    <div class="traffic-section">
      <div class="traffic-header">Trafikläget i Jönköpings län</div>
      <div class="traffic-list" id="traffic-list">
        <div class="traffic-item">Söker trafikstörningar...</div>
      </div>
    </div>
  </div>

  <!-- Högerpanel: Kartor -->
  <div class="maps-panel">
    <div class="map-box">
      <div class="map-label">Nederbörd / Radar</div>
      <iframe 
        id="radar-frame"
        src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=°C&metricWind=m%2Fs&zoom=7&overlay=radar&product=radar&level=surface&lat=57.186&lon=14.040" 
        loading="lazy">
      </iframe>
    </div>

    <div class="map-box">
      <div class="map-label">Åskradar / Blixtar</div>
      <iframe 
        id="lightning-frame"
        src="https://map.blitzortung.org/index.php?interactive=1#6.5/57.186/14.040" 
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script>
    const LAT = 57.1864;
    const LON = 14.0403;

    const weatherCodes = {
      0: "Klart", 1: "Mestadels klart", 2: "Halvklart", 3: "Molnigt",
      45: "Dimma", 48: "Rimfrostdimma", 51: "Lätt duggregn", 53: "Duggregn",
      55: "Tätt duggregn", 61: "Lätt regn", 63: "Regn", 65: "Kraftigt regn",
      71: "Lätt snöfall", 73: "Snöfall", 75: "Kraftigt snöfall",
      80: "Lätta skurar", 81: "Regnskurar", 82: "Kraftiga skurar", 95: "Åskväder"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    async function fetchWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms`);
        const data = await res.json();
        const cur = data.current;

        document.getElementById('temp').textContent = `${Math.round(cur.temperature_2m)}°C`;
        document.getElementById('condition').textContent = weatherCodes[cur.weather_code] || "Okänt läge";
        document.getElementById('wind').textContent = `${Math.round(cur.wind_speed_10m)} m/s`;
        document.getElementById('humidity').textContent = `${cur.relative_humidity_2m}%`;
      } catch (err) {
        document.getElementById('condition').textContent = "Kunde inte hämta data";
      }
    }

    // Trafikverkets API: Strikt begränsad till CountyNo 6 (Jönköpings län)
    async function fetchTraffic() {
      const container = document.getElementById('traffic-list');
      const xmlPayload = `
        <REQUEST>
          <LOGIN authenticationkey="5d4f134267254589a1fbbd09793108c9" />
          <QUERY objecttype="Situation" schemaversion="1.5" limit="5">
            <FILTER>
              <EQ name="Deviation.CountyNo" value="6" />
            </FILTER>
            <INCLUDE>Deviation.Header</INCLUDE>
            <INCLUDE>Deviation.Message</INCLUDE>
            <INCLUDE>Deviation.RoadNumber</INCLUDE>
          </QUERY>
        </REQUEST>`;

      try {
        const res = await fetch('https://api.trafikinfo.trafikverket.se/v2/data.json', {
          method: 'POST',
          headers: { 'Content-Type': 'text/xml' },
          body: xmlPayload
        });
        const json = await res.json();
        const situations = json.RESPONSE?.RESULT?.[0]?.Situation || [];

        const deviations = [];
        situations.forEach(sit => {
          if (Array.isArray(sit.Deviation)) {
            deviations.push(...sit.Deviation);
          } else if (sit.Deviation) {
            deviations.push(sit.Deviation);
          }
        });

        if (deviations.length === 0) {
          container.innerHTML = '<div class="traffic-item" style="color:#94a3b8;">Inga aktiva trafikstörningar i länet.</div>';
          return;
        }

        container.innerHTML = deviations.slice(0, 5).map(dev => `
          <div class="traffic-item">
            <div class="traffic-title">${dev.RoadNumber ? 'Väg ' + dev.RoadNumber + ': ' : ''}${dev.Header || 'Trafikstörning'}</div>
            <div class="traffic-desc">${dev.Message || 'Ingen ytterligare information.'}</div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="traffic-item" style="color:#f87171;">Kunde inte läsa in trafikdata från länet.</div>';
      }
    }

    async function fetchVMA() {
      const card = document.getElementById('vma-card');
      const icon = document.getElementById('vma-icon');
      const body = document.getElementById('vma-body');

      try {
        const res = await fetch('https://api.krisinformation.se/v3/vmas');
        if (!res.ok) throw new Error('Status ' + res.status);
        const list = await res.json();

        // Strikt kontroll mot Jönköpings län eller Värnamo
        const match = list.find(item => {
          const text = ((item.PushMessage || "") + " " + (item.BodyText || "") + " " + (item.Headline || "")).toLowerCase();
          return text.includes('jönköping') || text.includes('värnamo');
        });

        if (match) {
          card.classList.add('active');
          icon.textContent = '🚨';
          body.innerHTML = `<strong>${match.Headline || 'VMA UTFÄRDAT'}</strong><br>${match.PushMessage || match.BodyText}`;
        } else {
          card.classList.remove('active');
          icon.textContent = '🟢';
          body.textContent = 'Inga aktiva VMA i Jönköpings län.';
        }
      } catch (err) {
        card.classList.remove('active');
        icon.textContent = 'ℹ️';
        body.textContent = 'Kunde inte kontakta Krisinformation.';
      }
    }

    function refreshMaps() {
      const radar = document.getElementById('radar-frame');
      const lightning = document.getElementById('lightning-frame');
      if (radar) radar.src = radar.src;
      if (lightning) lightning.src = lightning.src;
    }

    // Intervaller
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 10 * 60 * 1000);
    setInterval(fetchTraffic, 3 * 60 * 1000);
    setInterval(fetchVMA, 2 * 60 * 1000);
    setInterval(refreshMaps, 10 * 60 * 1000);

    // Start
    updateClock();
    fetchWeather();
    fetchTraffic();
    fetchVMA();
  </script>
</body>
</html>
