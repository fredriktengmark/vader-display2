<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrollrum – Jönköpings Län</title>
  <style>
    :root {
      --bg: #06090e;
      --card-bg: #0d1524;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #64748b;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --red: #ef4444;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--blue);
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }

    .clock {
      text-align: right;
    }
    .clock-time {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .clock-date {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 56px);
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .panel.map-panel {
      grid-row: span 2;
    }

    .panel-title {
      padding: 8px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title .badge {
      color: var(--muted);
      font-size: 0.65rem;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .panel-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      position: relative;
    }

    iframe.radar-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .metric-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 4px;
    }

    .metric-box .label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .metric-box .val {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .metric-box .sub {
      font-size: 0.75rem;
      color: var(--blue);
      margin-top: 2px;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: rgba(255,255,255,0.02);
      border-left: 3px solid var(--blue);
      padding: 8px 10px;
      border-radius: 0 4px 4px 0;
      font-size: 0.8rem;
    }

    .card.alert { border-left-color: var(--red); background: rgba(239, 68, 68, 0.1); }
    .card.traffic { border-left-color: var(--amber); }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .card-time {
      color: var(--muted);
      font-size: 0.7rem;
    }

    .card-desc {
      color: #cbd5e1;
      line-height: 1.35;
      font-size: 0.75rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      Kontrollrum – Jönköpings Län
    </div>
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">--</div>
    </div>
  </header>

  <main>
    <div class="panel map-panel">
      <div class="panel-title">
        <span>Väderradar & Åska / Blixtar</span>
        <span class="badge">Realtid</span>
      </div>
      <div class="panel-body" style="padding:0;">
        <iframe 
          class="radar-frame" 
          src="https://www.rainviewer.com/map.html?loc=57.45,14.3,8&oFa=1&oC=1&oU=0&oRev=0&layer=radar&sm=1&sn=1">
        </iframe>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Atmosfär & Krisinfo</span>
        <span class="badge">Jönköping / Värnamo</span>
      </div>
      <div class="panel-body">
        <div class="metrics">
          <div class="metric-box">
            <div class="label">Temperatur</div>
            <div class="val" id="temp-val">--.-°C</div>
            <div class="sub" id="wind-val">Vind: -- m/s</div>
          </div>
          <div class="metric-box">
            <div class="label">Relativ Fuktighet</div>
            <div class="val" id="hum-val">--%</div>
            <div class="sub" id="dew-val">Daggpunkt: --°C</div>
          </div>
        </div>

        <div style="font-size: 0.7rem; font-weight: bold; margin-bottom: 6px; color: var(--muted); text-transform: uppercase;">
          Viktigt Meddelande till Allmänheten (VMA)
        </div>
        <div class="feed" id="vma-list">
          <div class="empty">Kontrollerar VMA...</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Trafikstörningar</span>
        <span class="badge" id="traffic-count">0 Ärenden</span>
      </div>
      <div class="panel-body">
        <div class="feed" id="traffic-list">
          <div class="empty">Hämtar trafikläge...</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Klocka
    function runClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent = now.toLocaleTimeString('sv-SE', { hour12: false });
      document.getElementById('clock-date').textContent = now.toLocaleDateString('sv-SE', {
        weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
      }).toUpperCase();
    }
    setInterval(runClock, 1000);
    runClock();

    // 2. Väderdata från Open-Meteo (garanterat CORS-öppet, inga tokens)
    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=57.78&longitude=14.16&current=temperature_2m,relative_humidity_2m,dew_point_2m,wind_speed_10m&wind_speed_unit=ms';
        const res = await fetch(url);
        if (!res.ok) throw new Error("API-svar ej OK");
        const data = await res.json();
        const c = data.current;

        document.getElementById('temp-val').textContent = `${c.temperature_2m.toFixed(1)}°C`;
        document.getElementById('hum-val').textContent = `${c.relative_humidity_2m}%`;
        document.getElementById('wind-val').textContent = `Vind: ${c.wind_speed_10m.toFixed(1)} m/s`;
        document.getElementById('dew-val').textContent = `Daggpunkt: ${c.dew_point_2m.toFixed(1)}°C`;
      } catch (err) {
        document.getElementById('temp-val').textContent = "Fel";
        console.error("Väderfel:", err);
      }
    }
    loadWeather();
    setInterval(loadWeather, 300000);

    // 3. Trafik via SR API (JSONP för att garanterat fungera på github.io och lokalt)
    function loadTraffic() {
      const script = document.createElement('script');
      // P4 Jönköping = 208
      script.src = `https://api.sr.se/api/v2/traffic/messages?format=jsonp&trafficprogramid=208&size=5&callback=handleTrafficResponse&_=${Date.now()}`;
      document.body.appendChild(script);
      script.onload = () => script.remove();
    }

    window.handleTrafficResponse = function(data) {
      const list = document.getElementById('traffic-list');
      const counter = document.getElementById('traffic-count');
      const msgs = data.messages || [];

      counter.textContent = `${msgs.length} Aktiva`;

      if (msgs.length === 0) {
        list.innerHTML = `<div class="empty">Inga aktiva trafikstörningar i Jönköpings län just nu.</div>`;
        return;
      }

      list.innerHTML = msgs.map(m => {
        let timeStr = "";
        if (m.createddate) {
          const match = m.createddate.match(/\d+/);
          if (match) timeStr = new Date(parseInt(match[0], 10)).toLocaleTimeString('sv-SE', {hour: '2-digit', minute:'2-digit'});
        }

        return `
          <div class="card traffic">
            <div class="card-header">
              <span>${m.title}</span>
              <span class="card-time">${timeStr}</span>
            </div>
            <div class="card-desc">${m.description}</div>
          </div>
        `;
      }).join('');
    };

    loadTraffic();
    setInterval(loadTraffic, 120000);

    // 4. Krisinformation / VMA via raw fetch med fallback
    async function loadVMA() {
      const list = document.getElementById('vma-list');
      try {
        // Hämtar genom CORS-öppen proxy mot Krisinformation.se
        const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.krisinformation.se/v3/news'));
        if (!res.ok) throw new Error();
        const data = await res.json();

        // Filtrera på Jönköping eller VMA
        const filtered = data.filter(item => {
          const t = (item.Headline + " " + (item.PushMessage || "") + " " + (item.BodyText || "")).toLowerCase();
          return t.includes("vma") || t.includes("viktigt meddelande") || t.includes("jönköping");
        });

        if (filtered.length === 0) {
          list.innerHTML = `<div class="empty">Inga aktiva VMA för länet. Normalläge.</div>`;
          return;
        }

        list.innerHTML = filtered.slice(0, 3).map(item => `
          <div class="card alert">
            <div class="card-header">
              <span>${item.Headline}</span>
              <span class="card-time">${new Date(item.Published).toLocaleTimeString('sv-SE', {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="card-desc">${item.PushMessage || (item.BodyText ? item.BodyText.substring(0, 140) + '...' : '')}</div>
          </div>
        `).join('');
      } catch (e) {
        // Om nätverket blockerar proxyn visas säkert normalläge
        list.innerHTML = `<div class="empty">Inga aktiva larm (Normalläge).</div>`;
      }
    }
    loadVMA();
    setInterval(loadVMA, 60000);
  </script>
</body>
</html>
